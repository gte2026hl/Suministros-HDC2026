<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <title>HDC 2026 - Ecosistema de Gestión Dual</title>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* ESTADO ACTIVO DE NAVEGACIÓN */
        .tab-active { 
            border-bottom: 2px solid #10b981; 
            color: #10b981; 
            background: rgba(16, 185, 129, 0.05);
        }
        
        /* EL SELLO INMUTABLE */
        .sello-bg { 
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%); 
            box-shadow: 0 4px 20px rgba(180, 83, 9, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .sello-text {
            background: linear-gradient(to right, #f8fafc 0%, #94a3b8 40%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            line-height: 1;
        }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <div id="login-view" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-10 rounded-[3rem] text-center space-y-8 border border-white/10 shadow-2xl">
            <div class="sello-bg w-28 h-28 rounded-2xl flex items-center justify-center mx-auto transform rotate-3 scale-110">
                <span class="sello-text text-2xl">HDC<br>2026</span>
            </div>
            <div class="space-y-4">
                <input type="text" id="user-input" placeholder="Usuario" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 transition-all text-xs font-bold uppercase tracking-widest">
                <input type="password" id="pass-input" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 transition-all text-xs font-bold tracking-widest">
                <button onclick="intentarLogin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.3em] shadow-xl shadow-amber-900/20 transition-all active:scale-95">Entrar al Portal</button>
            </div>
            <p class="text-[8px] text-slate-600 font-bold uppercase tracking-widest">HDC 2026 © Copyright | Inmutable</p>
        </div>
    </div>

    <div id="master-view" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-16 glass sticky top-0 z-50 flex items-center justify-between px-6 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="sello-bg w-10 h-10 rounded flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <h2 class="text-[10px] font-black tracking-widest uppercase">Panel Master</h2>
            </div>
            <div class="flex gap-1 h-full">
                <button onclick="showMasterSection('m-config')" id="nav-m-config" class="h-full px-6 text-[9px] font-black uppercase tracking-widest tab-active">Carga de Datos</button>
                <button onclick="showMasterSection('m-stats')" id="nav-m-stats" class="h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500">Estadísticas Globales</button>
                <button onclick="logout()" class="h-full px-4 text-rose-500 text-xs">✕</button>
            </div>
        </nav>

        <main class="p-8 space-y-6 flex-grow">
            <div id="sec-m-config" class="fade-in space-y-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="glass p-8 rounded-[2.5rem] space-y-6">
                        <h3 class="text-xs font-black uppercase tracking-widest text-amber-500">1. Identidad Territorial</h3>
                        <div class="space-y-4">
                            <input type="text" id="master-comunidad" placeholder="Comunidad (Ej: Casco Central 23 de Enero)" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl outline-none focus:border-amber-500 text-sm">
                            <input type="text" id="master-municipio" placeholder="Municipio / Sector" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl outline-none focus:border-amber-500 text-sm">
                        </div>
                    </div>
                    <div class="glass p-8 rounded-[2.5rem] space-y-6">
                        <h3 class="text-xs font-black uppercase tracking-widest text-emerald-500">2. Carga Excel (.xlsx)</h3>
                        <div class="border-2 border-dashed border-slate-800 rounded-3xl p-10 text-center">
                            <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls" onchange="handleExcel(this)">
                            <label for="excel-upload" class="cursor-pointer">
                                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                </div>
                                <p id="excel-status" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Subir Archivo de Habitantes</p>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="text-center"><button onclick="sincronizar()" class="bg-emerald-600 px-12 py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.3em] shadow-2xl">Sincronizar Ecosistema</button></div>
            </div>
            
            <div id="sec-m-stats" class="hidden fade-in glass p-10 rounded-[2.5rem]">
                <h3 class="text-xl font-black italic uppercase">Auditoría en Tiempo Real</h3>
                <p class="text-slate-500 text-xs mt-2">Vista del total acumulado por el sistema Master.</p>
            </div>
        </main>
    </div>

    <div id="jefe-view" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-14 glass sticky top-0 z-50 flex items-center justify-between px-6 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="sello-bg w-10 h-10 rounded flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <div class="leading-none">
                    <h2 id="disp-comunidad" class="text-[10px] font-bold tracking-[0.2em] uppercase text-slate-200">---</h2>
                    <p id="disp-sector" class="text-[8px] text-emerald-500 font-bold uppercase tracking-widest">---</p>
                </div>
            </div>
            <div class="flex gap-1 h-full">
                <button onclick="showJefeSection('gestion')" id="nav-gestion" class="h-full px-6 text-[9px] font-black uppercase tracking-widest tab-active transition-all">Cobros</button>
                <button onclick="showJefeSection('stats')" id="nav-stats" class="h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500 transition-all">Estadísticas</button>
                <button onclick="showJefeSection('despacho')" id="nav-despacho" class="h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500 transition-all">Despacho</button>
                <button onclick="logout()" class="h-full px-4 text-rose-500 text-xs">✕</button>
            </div>
        </nav>

        <main class="p-6 space-y-6">
            <div id="sec-gestion" class="fade-in space-y-6">
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
                    <div class="xl:col-span-4 glass p-4 rounded-3xl border-l-4 border-amber-500">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-slate-950/50 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">10KG</label><input type="number" id="p10" value="1500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-950/50 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">18KG</label><input type="number" id="p18" value="2500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-950/50 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">43KG</label><input type="number" id="p43" value="5500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                        </div>
                    </div>
                    <div id="totales-container" class="xl:col-span-8 grid grid-cols-4 gap-2"></div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                    <div class="xl:col-span-8 glass rounded-[2.5rem] p-8">
                        <div class="flex justify-between items-start mb-6">
                            <h3 class="text-xl font-black italic">VALIDADOR OPERATIVO</h3>
                            <div id="status-validacion" class="px-5 py-2 rounded-full text-[9px] font-black uppercase bg-slate-800 text-slate-500">Esperando Cédula</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <div><input type="number" id="ci" oninput="buscarYValidar(this.value)" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl text-xl mono focus:border-amber-500 outline-none" placeholder="CI BENEFICIARIO"><div id="perfil" class="mt-3 text-[11px] font-bold text-emerald-400 min-h-[1.5rem]"></div></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="ref" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mono text-xs outline-none" placeholder="REF">
                                    <input type="number" id="monto-ref" oninput="validarTodo()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl font-black text-white outline-none" placeholder="MONTO">
                                </div>
                            </div>
                            <div class="bg-slate-950/40 p-6 rounded-3xl border border-white/5 space-y-6">
                                <div class="grid grid-cols-3 gap-3">
                                    <input type="number" id="q10" value="0" min="0" oninput="validarTodo()" class="bg-slate-900 p-3 rounded-xl text-center font-black">
                                    <input type="number" id="q18" value="0" min="0" oninput="validarTodo()" class="bg-slate-900 p-3 rounded-xl text-center font-black">
                                    <input type="number" id="q43" value="0" min="0" oninput="validarTodo()" class="bg-slate-900 p-3 rounded-xl text-center font-black">
                                </div>
                                <div class="pt-4 border-t border-slate-800 flex justify-between items-center"><span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Total:</span><span id="monto-calc" class="text-2xl font-black mono text-white">0.00 Bs</span></div>
                                <button onclick="registrar()" id="btn-registrar" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all">Registrar Pago</button>
                            </div>
                        </div>
                    </div>
                    <div class="xl:col-span-4 glass rounded-[2rem] p-6 overflow-hidden">
                        <h4 class="text-[10px] font-black uppercase mb-6 flex justify-between"><span>Actividad</span><span id="count-pagos" class="text-emerald-500">0</span></h4>
                        <div id="lista-actividad" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <div id="sec-stats" class="hidden fade-in glass p-10 rounded-[2.5rem]">
                <h3 class="text-xl font-black italic uppercase mb-8">Portal Estadístico 1</h3>
                <div class="overflow-x-auto"><table
