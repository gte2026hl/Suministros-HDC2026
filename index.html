<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDC 1991 | Ecosistema de Gestión Dual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .active-portal-gas { border-bottom: 3px solid #10b981; color: #10b981; }
        .active-portal-clap { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="min-h-full flex flex-col">

    <!-- NAVEGACIÓN SUPERIOR DINÁMICA -->
    <nav class="glass-nav sticky top-0 z-50 w-full px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-500 rounded flex items-center justify-center font-bold text-slate-950 text-xs">HDC</div>
            <span class="text-sm font-semibold tracking-tighter uppercase">HDC 1991</span>
        </div>

        <!-- Selector de Portal -->
        <div class="flex gap-6 h-full items-center text-[11px] font-bold tracking-widest uppercase">
            <button id="nav-gas" class="h-full px-2 active-portal-gas transition-all duration-300">Gestión Gas</button>
            <button id="nav-clap" class="h-full px-2 opacity-40 hover:opacity-100 transition-all duration-300">Gestión CLAP</button>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right hidden sm:block">
                <p class="text-[10px] text-slate-500 leading-none">Jefe de Comunidad</p>
                <p class="text-xs font-medium">HDC User</p>
            </div>
            <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DE ALTO RENDIMIENTO -->
    <main id="main-content" class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full">
        
        <!-- HEADER DE SECCIÓN DINÁMICO -->
        <header class="mb-8 border-l-4 border-emerald-500 pl-4 py-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">Portal de Gestión de Gas</h1>
            <p class="text-slate-400 text-sm">Ciclo de Cobro: Mayo 2026 | Municipio Guacara</p>
        </header>

        <!-- ESPACIO PARA MÓDULOS (VERSIONES POSTERIORES) -->
        <div id="app-viewport" class="grid grid-cols-1 gap-6">
            <!-- Aquí inyectaremos los módulos de registro, pagos y balances -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-12 text-center">
                <p class="text-slate-500 italic">Arquitectura lista. Esperando inyección de lógica de datos...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER MÓVIL OPTIMIZADO -->
    <footer class="p-6 text-center text-slate-600 text-[10px] uppercase tracking-[0.2em] border-t border-slate-900">
        Ecosistema HDC 1991 &copy; 2026 | Trazabilidad Extraordinaria
    </footer>

</body>
</html>
