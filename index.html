<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <title>HDC 2026 - Ecosistema de Gestión Dual</title>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { border-bottom: 2px solid #10b981; color: #10b981; background: rgba(16, 185, 129, 0.05); }
        
        .sello-bg { 
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%); 
            box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .sello-text {
            background: linear-gradient(to right, #f8fafc 0%, #94a3b8 40%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            line-height: 1;
        }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <div id="login-view" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-10 rounded-[3rem] text-center space-y-8 border border-white/10 shadow-2xl">
            <div class="sello-bg w-28 h-28 rounded-2xl flex items-center justify-center mx-auto transform rotate-3 scale-110">
                <span class="sello-text text-2xl">HDC<br>2026</span>
            </div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter text-white">Acceso al Sistema</h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-2 italic">Trazabilidad Extraordinaria</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="user-input" placeholder="Usuario" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 transition-all text-xs font-bold uppercase tracking-widest">
                <input type="password" id="pass-input" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 transition-all text-xs font-bold tracking-widest">
                <button onclick="intentarLogin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.3em] shadow-xl shadow-amber-900/20 transition-all active:scale-95">Entrar al Portal</button>
            </div>
            <p class="text-[8px] text-slate-600 font-bold uppercase tracking-widest">HDC 2026 © Copyright | Inmutable</p>
        </div>
    </div>

    <div id="master-view" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-16 glass sticky top-0 z-50 flex items-center justify-between px-8 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="sello-bg w-10 h-10 rounded flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <h2 class="text-[10px] font-black tracking-widest uppercase text-amber-500">Panel Maestro</h2>
            </div>
            <div class="flex gap-1 h-full">
                <button onclick="showMasterSection('master-config')" id="nav-m-config" class="h-full px-6 text-[9px] font-black uppercase tracking-widest tab-active transition-all">Carga de Datos</button>
                <button onclick="showMasterSection('master-stats')" id="nav-m-stats" class="h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-all">Estadísticas Globales</button>
                <button onclick="logout()" class="h-full px-4 text-rose-500 text-[11px] font-bold">SALIR</button>
            </div>
        </nav>

        <main class="p-8 space-y-6 flex-grow animate-fade">
            <div id="sec-master-config" class="space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="glass p-8 rounded-[2.5rem] space-y-6 border-l-4 border-amber-500">
                        <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">1. Identidad Territorial</h3>
                        <div class="space-y-4">
                            <input type="text" id="master-comunidad" placeholder="Nombre de la Comunidad" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl outline-none focus:border-amber-500">
                            <input type="text" id="master-municipio" placeholder="Municipio / Sector" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl outline-none focus:border-amber-500">
                        </div>
                    </div>

                    <div class="glass p-8 rounded-[2.5rem] space-y-6 border-l-4 border-emerald-500">
                        <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">2. Carga de Nube (Excel .xlsx)</h3>
                        <div class="border-2 border-dashed border-slate-800 rounded-2xl p-8 text-center bg-slate-950/30">
                            <input type="file" id="excel-upload" class="hidden" accept=".xlsx, .xls" onchange="procesarExcel(this)">
                            <label for="excel-upload" class="cursor-pointer group">
                                <p class="text-xs font-bold text-slate-400 group-hover:text-emerald-500 transition-colors">Selecciona el archivo Excel del Censo</p>
                                <p class="text-[8px] text-slate-600 uppercase mt-2 tracking-widest">Formatos: .xlsx / .xls</p>
                            </label>
                        </div>
                        <div id="upload-status" class="text-center text-[10px] font-black uppercase tracking-widest"></div>
                    </div>
                </div>
                <div class="text-center">
                    <button onclick="guardarConfigMaster()" class="bg-emerald-600 hover:bg-emerald-500 px-16 py-4 rounded-2xl font-black text-[11px] uppercase tracking-[0.3em] shadow-xl shadow-emerald-900/20 transition-all active:scale-95">Sincronizar Ecosistema</button>
                </div>
            </div>

            <div id="sec-master-stats" class="hidden glass p-10 rounded-[3rem] animate-fade">
                <h3 class="text-xl font-black italic mb-8 uppercase tracking-tighter">Resumen Estadístico Consolidado</h3>
                <div id="master-stats-content" class="text-center py-20 text-slate-600 italic text-sm">Esperando sincronización de datos...</div>
            </div>
        </main>
    </div>

    <div id="jefe-view" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-14 glass sticky top-0 z-50 flex items-center justify-between px-6 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="sello-bg w-10 h-10 rounded flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <div class="leading-none">
                    <h2 id="jefe-comunidad-name" class="text-[10px] font-bold tracking-[0.2em] uppercase text-slate-200">Cargando...</h2>
                    <p id="jefe-municipio-name" class="text-[8px] text-emerald-500 font-bold uppercase tracking-widest">---</p>
                </div>
            </div>
            <div class="flex gap-2 h-full">
                <button onclick="showSection('gestion')" id="nav-gestion" class="h-full px-4 text-[9px] font-black uppercase tracking-widest tab-active">Cobros</button>
                <button onclick="showSection('stats')" id="nav-stats" class="h-full px-4 text-[9px] font-black uppercase tracking-widest text-slate-500">Estadísticas</button>
                <button onclick="showSection('despacho')" id="nav-despacho" class="h-full px-4 text-[9px] font-black uppercase tracking-widest text-slate-500">Despacho</button>
                <button onclick="logout()" class="h-full px-4 text-rose-500 text-[11px]">✕</button>
            </div>
        </nav>
        <main class="p-6 space-y-6">
            <div id="sec-gestion" class="animate-fade">
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 mb-6">
                    <div class="xl:col-span-4 glass p-4 rounded-3xl border-l-4 border-amber-500">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-slate-950/50 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">10KG</label><input type="number" id="p10" value="1500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-950/50 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">18KG</label><input type="number" id="p18" value="2500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-900/50 p-2 rounded-xl text-center opacity-50"><label class="text-[7px] text-slate-400 font-bold block">43KG</label><input type="number" id="p43" value="5500" readonly class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                        </div>
                    </div>
                    <div id="totales-container" class="xl:col-span-8 grid grid-cols-4 gap-2"></div>
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
                    <div class="xl:col-span-8 glass rounded-[2.5rem] p-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <div><label class="text-[9px] font-black text-slate-500 uppercase mb-2 block">Cédula</label><input type="number" id="ci" oninput="buscarYValidar(this.value)" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl text-xl mono focus:border-amber-500 outline-none" placeholder="00000000"><div id="perfil" class="mt-3 text-[11px] font-bold text-emerald-400"></div></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="ref" class="bg-slate-950 border border-slate-800 p-3 rounded-xl mono outline-none" placeholder="REF">
                                    <input type="number" id="monto-ref" oninput="validarTodo()" class="bg-slate-900 border border-slate-700 p-3 rounded-xl font-black text-white" placeholder="0.00">
                                </div>
                            </div>
                            <div class="bg-slate-950/40 p-6 rounded-3xl space-y-6 text-center">
                                <div class="grid grid-cols-2 gap-3">
                                    <div><span class="text-[8px] font-bold opacity-50 block mb-1">10KG</span><input type="number" id="q10" value="0" min="0" oninput="validarTodo()" class="w-full bg-slate-900 p-3 rounded-xl text-center font-black"></div>
                                    <div><span class="text-[8px] font-bold opacity-50 block mb-1">18KG</span><input type="number" id="q18" value="0" min="0" oninput="validarTodo()" class="w-full bg-slate-900 p-3 rounded-xl text-center font-black"></div>
                                </div>
                                <div id="status-validacion" class="text-[9px] font-black uppercase text-slate-500 py-2">Esperando Datos</div>
                                <button onclick="registrar()" id="btn-registrar" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">Confirmar Pago</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </main>
    </div>

    <script>
        let censoGlobal = [];
        let registrosGlobales = [];
        let comunidadConfig = { nombre: "Sin Definir", sector: "Sin Definir" };

        const USUARIOS = {
            "master": { pass: "master2026", role: "MASTER" },
            "jefe23": { pass: "casco23", role: "JEFE" }
        };

        function intentarLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;
            if (USUARIOS[u] && USUARIOS[u].pass === p) {
                document.getElementById('login-view').classList.add('hidden');
                if (USUARIOS[u].role === "MASTER") {
                    document.getElementById('master-view').classList.remove('hidden');
                } else {
                    cargarVistaJefe();
                }
            } else { alert("Acceso Denegado"); }
        }

        function logout() { location.reload(); }

        // NAVEGACIÓN MASTER (Sombreado dinámico)
        function showMasterSection(id) {
            ['master-config', 'master-stats'].forEach(s => document.getElementById(`sec-${s}`).classList.add('hidden'));
            document.getElementById(`sec-${id}`).classList.remove('hidden');
            
            document.getElementById('nav-m-config').className = "h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-all";
            document.getElementById('nav-m-stats').className = "h-full px-6 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-all";
            
            const activeId = id === 'master-config' ? 'nav-m-config' : 'nav-m-stats';
            document.getElementById(activeId).classList.add('tab-active');
        }

        // MOTOR EXCEL (.xlsx)
        function procesarExcel(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                // Mapear asumiendo columnas: Nombre (0), Calle (1), Cédula (2)
                censoGlobal = json.slice(1).map(row => ({
                    nombre: row[0]?.toString().trim(),
                    calle: row[1]?.toString().trim(),
                    ci: row[2]?.toString().trim()
                })).filter(h => h.ci);

                const status = document.getElementById('upload-status');
                status.innerText = `✓ Nube Sincronizada: ${censoGlobal.length} Habitantes`;
                status.className = "text-center text-[10px] font-black uppercase tracking-widest text-emerald-500";
            };
            reader.readAsArrayBuffer(file);
        }

        function guardarConfigMaster() {
            comunidadConfig.nombre = document.getElementById('master-comunidad').value;
            comunidadConfig.sector = document.getElementById('master-municipio').value;
            if(!comunidadConfig.nombre) return alert("Indique el nombre de la comunidad");
            alert("Ecosistema HDC 2026 Actualizado Exitosamente.");
            logout();
        }

        // LÓGICA JEFE (RESTAURADA)
        function cargarVistaJefe() {
            document.getElementById('jefe-view').classList.remove('hidden');
            document.getElementById('jefe-comunidad-name').innerText = comunidadConfig.nombre || "COMUNIDAD DEMO";
            document.getElementById('jefe-municipio-name').innerText = comunidadConfig.sector || "MUNICIPIO";
        }

        function showSection(id) {
            // Lógica similar para el Jefe...
        }

        function buscarYValidar(val) {
            const h = censoGlobal.find(p => p.ci === val);
            document.getElementById('perfil').innerText = h ? `${h.nombre} • ${h.calle}` : "No registrado";
        }

        function validarTodo() {
            const p10 = 1500, p18 = 2500;
            const q10 = parseInt(document.getElementById('q10').value) || 0;
            const q18 = parseInt(document.getElementById('q18').value) || 0;
            const montoRef = parseFloat(document.getElementById('monto-ref').value) || 0;
            const total = (q10 * p10) + (q18 * p18);
            document.getElementById('monto-calculado').innerText = total.toFixed(2) + " Bs";
            
            const btn = document.getElementById('btn-registrar');
            const status = document.getElementById('status-validacion');
            if (total > 0 && Math.abs(total - montoRef) < 0.1) {
                btn.disabled = false; btn.className = "w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]";
                status.innerText = "✓ Monto Correcto"; status.className = "text-emerald-500 text-[9px] font-black uppercase py-2";
            } else {
                btn.disabled = true; btn.className = "w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px]";
                status.innerText = total > 0 ? "✗ Diferencia en Monto" : "Esperando Datos";
                status.className = "text-rose-500 text-[9px] font-black uppercase py-2";
            }
        }
    </script>
</body>
</html>
