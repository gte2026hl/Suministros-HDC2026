<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <nav class="w-full h-12 glass sticky top-0 z-50 flex items-center justify-between px-6 border-b border-slate-800">
        <div class="flex items-center gap-4">
            <span class="bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded">HDC 1991</span>
            <h2 class="text-[10px] font-bold tracking-[0.3em] uppercase text-slate-400">Casco Central 23 de Enero</h2>
        </div>
        <div class="flex gap-4 h-full">
            <button onclick="switchPortal('gas')" class="h-full px-4 text-[10px] font-bold uppercase border-b-2 border-emerald-500 text-emerald-500">Gestión Gas</button>
            <button onclick="switchPortal('clap')" class="h-full px-4 text-[10px] font-bold uppercase text-slate-500 hover:text-white">Gestión CLAP</button>
        </div>
    </nav>

    <main class="p-4 space-y-4">
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
            
            <div class="xl:col-span-4 glass p-4 rounded-2xl">
                <p class="text-[9px] font-black text-emerald-500 uppercase tracking-widest mb-3">Configuración de Precios (Ciclo Actual)</p>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                        <label class="text-[8px] block text-slate-500 uppercase font-bold">10KG (Bs)</label>
                        <input type="number" id="p10" value="1500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-sm outline-none text-white">
                    </div>
                    <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                        <label class="text-[8px] block text-slate-500 uppercase font-bold">18KG (Bs)</label>
                        <input type="number" id="p18" value="2500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-sm outline-none text-white">
                    </div>
                    <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                        <label class="text-[8px] block text-slate-500 uppercase font-bold">43KG (Bs)</label>
                        <input type="number" id="p43" value="5500" oninput="validarTodo()" class="bg-transparent w-full font-bold text-sm outline-none text-white">
                    </div>
                </div>
            </div>

            <div id="totales-container" class="xl:col-span-8 grid grid-cols-4 gap-2">
                </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
            
            <div class="xl:col-span-8 glass rounded-3xl p-6">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-xl font-black italic">VALIDADOR DE PAGOS</h3>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Cruce de referencia bancaria vs cilindros</p>
                    </div>
                    <div id="status-validacion" class="px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-tighter bg-slate-800 text-slate-500">
                        Esperando Datos
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase">Cédula del Vecino</label>
                            <input type="text" id="ci" oninput="buscarYValidar(this.value)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-lg mono outline-none focus:border-emerald-500" placeholder="V-00000000">
                            <div id="perfil" class="mt-2 text-xs font-bold text-emerald-400 min-h-[1.5rem]"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[9px] font-bold text-slate-500 uppercase">Referencia</label>
                                <input type="text" id="ref" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mono outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-slate-500 uppercase italic">Monto de la Referencia</label>
                                <input type="number" id="monto-ref" oninput="validarTodo()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl font-black text-white outline-none focus:border-blue-500" placeholder="0.00">
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950/40 p-4 rounded-2xl border border-white/5 space-y-4">
                        <label class="text-[9px] font-bold text-slate-400 uppercase block mb-2 text-center underline">Cantidad de Cilindros a Entregar</label>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div>
                                <span class="text-[9px] font-bold block opacity-50 mb-1">10KG</span>
                                <input type="number" id="q10" value="0" min="0" oninput="validarTodo()" class="w-full bg-slate-900 p-2 rounded-lg text-center font-black">
                            </div>
                            <div>
                                <span class="text-[9px] font-bold block opacity-50 mb-1">18KG</span>
                                <input type="number" id="q18" value="0" min="0" oninput="validarTodo()" class="w-full bg-slate-900 p-2 rounded-lg text-center font-black">
                            </div>
                            <div>
                                <span class="text-[9px] font-bold block opacity-50 mb-1">43KG</span>
                                <input type="number" id="q43" value="0" min="0" oninput="validarTodo()" class="w-full bg-slate-900 p-2 rounded-lg text-center font-black">
                            </div>
                        </div>

                        <div class="pt-4 mt-2 border-t border-slate-800 flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">Monto Requerido:</span>
                            <span id="monto-calculado" class="text-xl font-black mono text-white">0.00 Bs</span>
                        </div>
                        
                        <button onclick="registrar()" id="btn-registrar" disabled class="w-full bg-slate-800 text-slate-500 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all">
                            Procesar y Guardar
                        </button>
                    </div>
                </div>
            </div>

            <div class="xl:col-span-4 glass rounded-3xl p-4 overflow-hidden">
                <h4 class="text-[10px] font-black uppercase tracking-widest mb-4 flex justify-between">
                    <span>Resumen de Operación</span>
                    <span class="text-emerald-500" id="count-pagos">0 Transacciones</span>
                </h4>
                <div id="lista-actividad" class="space-y-2 overflow-y-auto max-h-[400px] pr-2">
                    </div>
            </div>
        </div>
    </main>

    <script>
        // Data de ejemplo (esto vendría del archivo Master)
        const censo = [
            { ci: "12345678", nombre: "MARILUZ FUENTES", calle: "PLAZA" },
            { ci: "23456789", nombre: "ANA CASTILLO", calle: "ZAMORA" }
        ];

        let registros = [];

        function validarTodo() {
            const p10 = parseFloat(document.getElementById('p10').value) || 0;
            const p18 = parseFloat(document.getElementById('p18').value) || 0;
            const p43 = parseFloat(document.getElementById('p43').value) || 0;

            const q10 = parseInt(document.getElementById('q10').value) || 0;
            const q18 = parseInt(document.getElementById('q18').value) || 0;
            const q43 = parseInt(document.getElementById('q43').value) || 0;

            const montoRef = parseFloat(document.getElementById('monto-ref').value) || 0;
            const requerido = (q10 * p10) + (q18 * p18) + (q43 * p43);

            document.getElementById('monto-calculado').innerText = requerido.toFixed(2) + " Bs";

            const status = document.getElementById('status-validacion');
            const btn = document.getElementById('btn-registrar');

            if (requerido > 0 && montoRef === requerido) {
                status.innerText = "Monto Coincide ✓";
                status.className = "px-4 py-2 rounded-full text-[10px] font-black uppercase bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20";
                btn.disabled = false;
                btn.className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all hover:bg-emerald-500 active:scale-95";
            } else if (requerido > 0 && montoRef !== requerido) {
                status.innerText = "Error de Monto ✗";
                status.className = "px-4 py-2 rounded-full text-[10px] font-black uppercase bg-rose-500 text-white";
                btn.disabled = true;
                btn.className = "w-full bg-slate-800 text-slate-500 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest cursor-not-allowed";
            } else {
                status.innerText = "Esperando Datos";
                status.className = "px-4 py-2 rounded-full text-[10px] font-black uppercase bg-slate-800 text-slate-500";
                btn.disabled = true;
            }
        }

        function buscarYValidar(val) {
            const h = censo.find(p => p.ci === val);
            document.getElementById('perfil').innerText = h ? `${h.nombre} - CALLE ${h.calle}` : "";
            validarTodo();
        }

        function registrar() {
            const data = {
                ci: document.getElementById('ci').value,
                ref: document.getElementById('ref').value,
                monto: parseFloat(document.getElementById('monto-ref').value),
                q: `${document.getElementById('q10').value}/${document.getElementById('q18').value}/${document.getElementById('q43').value}`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            registros.unshift(data);
            actualizarUI();
            limpiarForm();
        }

        function actualizarUI() {
            // Totales
            const totals = registros.reduce((acc, r) => {
                const parts = r.q.split('/');
                acc.c10 += parseInt(parts[0]); acc.c18 += parseInt(parts[1]); acc.c43 += parseInt(parts[2]); acc.bs += r.monto;
                return acc;
            }, { c10:0, c18:0, c43:0, bs:0 });

            document.getElementById('totales-container').innerHTML = `
                ${renderCard("10KG", totals.c10, "emerald")}
                ${renderCard("18KG", totals.c18, "emerald")}
                ${renderCard("43KG", totals.c43, "emerald")}
                ${renderCard("TOTAL BS", totals.bs.toFixed(2), "blue")}
            `;

            document.getElementById('count-pagos').innerText = `${registros.length} Transacciones`;

            // Lista
            document.getElementById('lista-actividad').innerHTML = registros.map(r => `
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800 flex justify-between items-center animate-fade-in">
                    <div>
                        <p class="text-[10px] font-black text-white">${r.ci}</p>
                        <p class="text-[8px] text-slate-500">REF: ${r.ref} | ${r.time}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-emerald-500">${r.monto} BS</p>
                        <p class="text-[8px] text-slate-600 italic">Q: ${r.q}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderCard(label, val, col) {
            return `<div class="glass p-3 rounded-2xl border-l-4 border-${col}-500">
                <p class="text-[8px] font-black text-slate-500 uppercase">${label}</p>
                <p class="text-xl font-black text-white">${val}</p>
            </div>`;
        }

        function limpiarForm() {
            document.getElementById('ci').value = "";
            document.getElementById('ref').value = "";
            document.getElementById('monto-ref').value = "";
            document.getElementById('q10').value = 0;
            document.getElementById('q18').value = 0;
            document.getElementById('q43').value = 0;
            document.getElementById('perfil').innerText = "";
            validarTodo();
        }

        actualizarUI();
    </script>
</body>
</html>
