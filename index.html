<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <title>HDC 2026 - Ecosistema Inmutable</title>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { border-bottom: 3px solid #10b981 !important; color: #10b981 !important; font-weight: 900 !important; }
        .sello-bg { background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%); box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); }
        .sello-text { background: linear-gradient(to right, #f8fafc 0%, #94a3b8 40%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; line-height: 1; }
        input { font-size: 16px !important; }
        .loading-bar { height: 3px; background: linear-gradient(to right, #fbbf24, #10b981); width: 0%; transition: width 0.4s ease; position: fixed; top: 0; left: 0; z-index: 200; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden bg-slate-950">

    <div id="loader" class="loading-bar"></div>

    <div id="login-view" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="max-w-sm w-full glass p-8 rounded-[3rem] text-center space-y-6 border border-white/10 shadow-2xl">
            <div class="sello-bg w-24 h-24 rounded-2xl flex items-center justify-center mx-auto transform rotate-3 scale-110">
                <span class="sello-text text-xl">HDC<br>2026</span>
            </div>
            <div>
                <h1 class="text-xl font-black uppercase text-white tracking-tighter italic">Acceso Comunidad</h1>
                <p class="text-[8px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-1 italic">Trazabilidad Extraordinaria</p>
            </div>
            <div class="space-y-3">
                <input type="text" id="user-input" placeholder="USUARIO" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 text-xs font-black uppercase tracking-widest text-white">
                <div class="relative">
                    <input type="password" id="pass-input" placeholder="CONTRASEÑA" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 text-xs font-black tracking-widest text-white">
                    <button onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500" id="eye-btn">👁️</button>
                </div>
                <button onclick="intentarLogin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl active:scale-95 transition-all">Iniciar Sistema</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-16 glass sticky top-0 z-50 flex items-center justify-between px-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="sello-bg w-10 h-10 rounded-lg flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <div class="leading-none border-l border-slate-800 pl-3">
                    <h2 id="nav-comunidad" class="text-[9px] font-black uppercase text-slate-200 truncate max-w-[120px]">---</h2>
                    <p id="nav-sector" class="text-[7px] text-emerald-500 font-bold uppercase mt-1">---</p>
                </div>
            </div>
            <div id="nav-container" class="flex items-center h-full"></div>
        </nav>

        <main class="p-4 flex-grow space-y-4" id="app-view"></main>

        <footer class="p-4 text-center text-slate-700 text-[8px] font-black uppercase tracking-[0.3em] glass border-t border-slate-900 no-print">
            HDC 2026 © Trazabilidad Inmutable
        </footer>
    </div>

    <script>
        const SB_URL = "https://wokszafewnnsmmhsvsqf.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indva3N6YWZld25uc21taHN2c3FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2ODkyMjEsImV4cCI6MjA5NDI2NTIyMX0.gYZ6rVgc74nE1Kxlykvr_beItgA6ndfv2bMs3godQK0";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        let uSession = null;
        let censo = [];
        let pagos = [];
        let config = {};
        let selectedComId = null;

        // --- MOTOR DE PERSISTENCIA Y CARGA ---
        window.onload = async () => {
            const saved = localStorage.getItem('hdc_session');
            if(saved) {
                uSession = JSON.parse(saved);
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                updateLoader(40);
                await syncData();
                renderNav();
                uSession.role === 'MASTER' ? showMasterDashboard() : showJefe('gestion');
                updateLoader(100);
            }
        }

        function updateLoader(pct) { document.getElementById('loader').style.width = pct + "%"; if(pct === 100) setTimeout(()=> document.getElementById('loader').style.width = "0%", 400); }

        function togglePass() {
            const input = document.getElementById('pass-input');
            const btn = document.getElementById('eye-btn');
            if(input.type === "password") { input.type = "text"; btn.innerText = "🔒"; }
            else { input.type = "password"; btn.innerText = "👁️"; }
        }

        async function intentarLogin() {
            updateLoader(30);
            const u = document.getElementById('user-input').value.toLowerCase().trim();
            const p = document.getElementById('pass-input').value.trim();
            const { data, error } = await _sb.from('perfiles').select('*').eq('usuario', u).eq('password', p).maybeSingle();
            
            if (data) {
                uSession = data;
                localStorage.setItem('hdc_session', JSON.stringify(data));
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                await syncData();
                renderNav();
                uSession.role === 'MASTER' ? showMasterDashboard() : showJefe('gestion');
                updateLoader(100);
            } else {
                updateLoader(0);
                alert("Acceso Denegado.");
            }
        }

        async function syncData() {
            const filterId = uSession.id;
            const { data: c } = await _sb.from('configuracion').select('*').eq('comunidad_id', filterId).maybeSingle();
            const { data: h } = await _sb.from('habitantes').select('*').eq('comunidad_id', filterId);
            const { data: pg } = await _sb.from('pagos').select('*').eq('comunidad_id', filterId).order('created_at', { ascending: false });
            
            config = c || { p10: 1500, p18: 2500, p43: 5500 }; 
            censo = h || []; 
            pagos = pg || [];

            document.getElementById('nav-comunidad').innerText = uSession.comunidad_name || "ADMIN MASTER";
            document.getElementById('nav-sector').innerText = uSession.municipio_name || "GUACARA";
        }

        function renderNav() {
            const c = document.getElementById('nav-container');
            if(uSession.role === 'MASTER') {
                c.innerHTML = `<button onclick="showMasterDashboard()" id="n-master" class="h-full px-4 text-[9px] font-black uppercase tab-active">Admin Central</button>`;
            } else {
                c.innerHTML = `
                    <button onclick="showJefe('gestion')" id="n-gestion" class="h-full px-4 text-[9px] font-black uppercase tab-active">Cobros</button>
                    <button onclick="showJefe('stats')" id="n-stats" class="h-full px-4 text-[9px] font-black uppercase text-slate-500">Stats</button>
                    <button onclick="showJefe('despacho')" id="n-despacho" class="h-full px-4 text-[9px] font-black uppercase text-slate-500">Día D</button>
                `;
            }
            c.innerHTML += `<button onclick="logout()" class="h-full px-4 text-rose-500 text-lg">✕</button>`;
        }

        function logout() { localStorage.removeItem('hdc_session'); location.reload(); }

        function setActiveTab(id) {
            document.querySelectorAll('#nav-container button').forEach(b => { b.classList.remove('tab-active'); b.classList.add('text-slate-500'); });
            const act = document.getElementById(`n-${id}`);
            if(act) { act.classList.add('tab-active'); act.classList.remove('text-slate-500'); }
        }

        // --- VISTA MASTER: REGISTRO CON MUNICIPIO ---
        async function showMasterDashboard() {
            setActiveTab('master');
            updateLoader(50);
            const { data: comunidades } = await _sb.from('perfiles').select('*').eq('role', 'JEFE');
            updateLoader(100);
            document.getElementById('app-view').innerHTML = `
                <div class="space-y-4 fade-in">
                    <div class="glass p-6 rounded-[2.5rem] space-y-4">
                        <h3 class="text-[10px] font-black text-amber-500 uppercase tracking-widest italic">Desplegar Ecosistema</h3>
                        <div class="grid grid-cols-1 gap-2">
                            <input type="text" id="nu-u" placeholder="USUARIO JEFE" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-[10px] uppercase text-white outline-none">
                            <input type="text" id="nu-p" placeholder="PASSWORD" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-[10px] text-white outline-none">
                            <input type="text" id="nu-c" placeholder="NOMBRE COMUNIDAD" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-[10px] uppercase text-white outline-none">
                            <input type="text" id="nu-m" placeholder="MUNICIPIO / SECTOR" class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-[10px] uppercase text-white outline-none">
                            <button onclick="crearComunidad()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-black text-[10px] uppercase">Activar Comunidad</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-3">
                        ${comunidades.map(c => `
                            <div class="glass p-5 rounded-[1.8rem] border-l-4 border-amber-500 flex justify-between items-center">
                                <div class="max-w-[60%]">
                                    <h4 class="text-[11px] font-black text-white uppercase truncate">${c.comunidad_name}</h4>
                                    <p class="text-[8px] text-emerald-500 font-bold uppercase mt-1">${c.municipio_name || 'MUNICIPIO'}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="prepararCarga('${c.id}')" class="bg-slate-800 text-white p-3 rounded-xl font-black text-[9px] uppercase">Excel</button>
                                    <button onclick="borrarComunidad('${c.id}')" class="bg-rose-500/10 text-rose-500 p-3 rounded-xl font-black text-[9px]">✕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        async function crearComunidad() {
            const u = document.getElementById('nu-u').value.toLowerCase().trim();
            const p = document.getElementById('nu-p').value.trim();
            const c = document.getElementById('nu-c').value.toUpperCase().trim();
            const m = document.getElementById('nu-m').value.toUpperCase().trim();
            if(!u || !p || !c || !m) return alert("Complete todos los campos de identidad");
            
            updateLoader(40);
            const { data: newUser } = await _sb.from('perfiles').insert([{ usuario: u, password: p, role: 'JEFE', comunidad_name: c, municipio_name: m }]).select().single();
            if(newUser) {
                await _sb.from('configuracion').insert([{ comunidad_id: newUser.id }]);
                updateLoader(100);
                alert("Comunidad " + c + " Activada."); showMasterDashboard();
            }
        }

        function prepararCarga(comId) {
            selectedComId = comId;
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.xlsx';
            input.onchange = (e) => ejecutarExcel(e.target.files[0]);
            input.click();
        }

        async function ejecutarExcel(file) {
            updateLoader(30);
            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header:1});
                const rows = json.slice(1).map(r => ({
                    nombre: String(r[0] || "").trim(),
                    calle: String(r[1] || "").trim(),
                    ci: String(r[2] || "").trim(),
                    comunidad_id: selectedComId
                })).filter(h => h.ci && h.ci !== "undefined");

                await _sb.from('habitantes').delete().eq('comunidad_id', selectedComId);
                await _sb.from('habitantes').insert(rows);
                updateLoader(100);
                alert("Censo Sincronizado.");
            };
            reader.readAsArrayBuffer(file);
        }

        // --- VISTA JEFE: OPERACIÓN Y PDF ---
        function showJefe(sec) {
            setActiveTab(sec);
            const view = document.getElementById('app-view');
            if(sec === 'gestion') {
                view.innerHTML = `
                <div class="space-y-4 fade-in">
                    <div class="glass p-4 rounded-[1.5rem] border-l-4 border-amber-500">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[9px] font-black text-amber-500 uppercase italic">Ajuste de Precios</span>
                            <button onclick="guardarPrecios()" class="text-[8px] font-black bg-emerald-600 px-3 py-1 rounded-full text-white uppercase">Fijar</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-600 block uppercase">10kg</label><input type="number" id="p10" value="${config.p10}" oninput="validar()" class="bg-transparent w-full font-black text-xs text-center outline-none"></div>
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-600 block uppercase">18kg</label><input type="number" id="p18" value="${config.p18}" oninput="validar()" class="bg-transparent w-full font-black text-xs text-center outline-none"></div>
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-600 block uppercase">43kg</label><input type="number" id="p43" value="${config.p43}" oninput="validar()" class="bg-transparent w-full font-black text-xs text-center outline-none"></div>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-[2rem] space-y-6">
                        <div class="flex justify-between"><h3 class="text-xs font-black uppercase tracking-tighter">Validador Tact.01</h3><div id="badge" class="px-3 py-1 rounded-full text-[8px] font-black bg-slate-800 text-slate-500 uppercase">Listo</div></div>
                        <input type="number" id="ci" oninput="lookCI(this.value)" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-xl mono focus:border-amber-500 outline-none text-white" placeholder="CÉDULA">
                        <div id="v-name" class="text-emerald-400 font-black uppercase text-[10px] min-h-[1rem] italic"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="ref" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[10px] uppercase font-black text-white" placeholder="REF">
                            <input type="number" id="m-ref" oninput="validar()" class="bg-slate-900 p-3 rounded-xl border border-slate-700 font-black text-white text-[10px]" placeholder="MONTO BS">
                        </div>
                        <div class="grid grid-cols-3 gap-2 py-4 border-y border-slate-800">
                            <input type="number" id="q10" value="0" oninput="validar()" class="bg-slate-900 p-3 rounded-lg text-center font-black text-xs">
                            <input type="number" id="q18" value="0" oninput="validar()" class="bg-slate-900 p-3 rounded-lg text-center font-black text-xs">
                            <input type="number" id="q43" value="0" oninput="validar()" class="bg-slate-900 p-3 rounded-lg text-center font-black text-xs">
                        </div>
                        <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-500 uppercase">Requerido:</span><span id="v-calc" class="text-2xl font-black mono text-white">0.00</span></div>
                        <button onclick="ejecutarCobro()" id="v-btn" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95">Registrar Cobro</button>
                    </div>
                    <div id="h-list" class="space-y-2"></div>
                </div>`;
                updateJefeUI();
            } else if (sec === 'stats') {
                const paid = pagos.map(p => p.ci);
                const pend = censo.filter(h => !paid.includes(h.ci));
                view.innerHTML = `
                <div class="space-y-4 fade-in">
                    <div class="flex justify-end"><button onclick="generarPDFStats()" class="bg-rose-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Generar PDF Estadísticas</button></div>
                    <div class="glass p-6 rounded-[2.5rem] border-l-4 border-emerald-500">
                        <h3 class="text-xs font-black text-emerald-500 uppercase mb-4 italic">Recaudación Calle</h3>
                        <div class="space-y-2">
                            ${Object.entries(pagos.reduce((a,p)=>{const c=censo.find(h=>h.ci===p.ci)?.calle||'S/C'; a[c]=(a[c]||0)+p.monto; return a;},{})).map(([c,m])=>`<div class="flex justify-between text-[10px] p-2 bg-slate-900/50 rounded-lg"><span class="font-black uppercase">${c}</span><span class="text-emerald-500 font-black">${m.toFixed(2)} Bs</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="glass p-6 rounded-[2.5rem] border-l-4 border-rose-500">
                        <h3 class="text-xs font-black text-rose-500 uppercase mb-4 italic">Pendientes (${pend.length})</h3>
                        <div class="overflow-y-auto max-h-[300px] space-y-2">
                            ${pend.map(h => `<div class="bg-slate-900/50 p-2 rounded-lg flex justify-between"><span class="text-[9px] font-bold uppercase">${h.nombre}</span><span class="text-[9px] text-slate-500 uppercase">${h.calle}</span></div>`).join('')}
                        </div>
                    </div>
                </div>`;
            } else if (sec === 'despacho') {
                view.innerHTML = `
                <div class="space-y-4 fade-in">
                    <div class="flex justify-end"><button onclick="generarPDFDespacho()" class="bg-rose-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Generar Reporte Despacho</button></div>
                    <div class="glass p-6 rounded-[2.5rem]">
                        <h3 class="text-xs font-black text-white uppercase mb-4 italic">Conciliación de Entrega</h3>
                        <div class="space-y-3 overflow-y-auto max-h-[500px]">
                            ${pagos.map((p, idx) => {
                                const h = censo.find(x => x.ci === p.ci);
                                return `<div class="p-4 bg-slate-900/50 rounded-2xl border border-white/5 space-y-3">
                                    <div class="flex justify-between items-start"><div><p class="text-[10px] font-black uppercase text-white">${h?.nombre || 'S/N'}</p><p class="text-[8px] text-slate-500 font-bold uppercase">${h?.calle}</p></div><span class="text-[10px] font-black text-emerald-500">${p.q10+p.q18+p.q43} Cyl</span></div>
                                    <div class="flex items-center gap-4">
                                        <label class="text-[8px] font-black uppercase text-slate-500">Recibido:</label>
                                        <input type="number" onchange="updateRecibido('${p.id}', this.value)" value="${p.recibidos}" class="w-16 bg-slate-950 p-2 rounded-lg text-center font-black text-xs border border-slate-800">
                                        <span class="text-[10px] ${p.recibidos == (p.q10+p.q18+p.q43) ? 'text-emerald-500':'text-rose-500'} font-black">${p.recibidos == (p.q10+p.q18+p.q43) ? '✓':'✗'}</span>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            }
        }

        async function guardarPrecios() {
            updateLoader(50);
            const p = { p10: document.getElementById('p10').value, p18: document.getElementById('p18').value, p43: document.getElementById('p43').value };
            await _sb.from('configuracion').update(p).eq('comunidad_id', uSession.id);
            await syncData(); updateLoader(100); alert("Precios Nube Actualizados.");
        }

        function lookCI(v) { const h = censo.find(x => x.ci === v); document.getElementById('v-name').innerText = h ? `${h.nombre} • ${h.calle}` : ""; validar(); }

        function validar() {
            const r = (document.getElementById('q10').value * document.getElementById('p10').value) + (document.getElementById('q18').value * document.getElementById('p18').value) + (document.getElementById('q43').value * document.getElementById('p43').value);
            const m = parseFloat(document.getElementById('m-ref').value) || 0;
            document.getElementById('v-calc').innerText = r.toFixed(2);
            const b = document.getElementById('v-btn'); const bd = document.getElementById('badge');
            if(r > 0 && Math.abs(r - m) < 0.1) {
                b.disabled = false; b.className = "w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] shadow-lg shadow-emerald-500/20";
                bd.className = "px-3 py-1 rounded-full text-[8px] font-black bg-emerald-500 text-slate-950 uppercase"; bd.innerText = "✓ COINCIDE";
            } else {
                b.disabled = true; b.className = "w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black uppercase text-[10px]";
                bd.className = "px-3 py-1 rounded-full text-[8px] font-black bg-slate-800 text-slate-500 uppercase"; bd.innerText = r > 0 ? "✗ DIFERENCIA" : "LISTO";
            }
        }

        async function ejecutarCobro() {
            updateLoader(40);
            const d = { ci: document.getElementById('ci').value, referencia: document.getElementById('ref').value, monto: parseFloat(document.getElementById('m-ref').value), q10: parseInt(document.getElementById('q10').value), q18: parseInt(document.getElementById('q18').value), q43: parseInt(document.getElementById('q43').value), comunidad_id: uSession.id, registrado_por: uSession.usuario };
            await _sb.from('pagos').insert([d]); await syncData(); showJefe('gestion'); updateLoader(100);
        }

        async function updateRecibido(pid, val) { await _sb.from('pagos').update({ recibidos: parseInt(val) }).eq('id', pid); await syncData(); }

        function updateJefeUI() {
            document.getElementById('h-list').innerHTML = pagos.map(p => `<div class="bg-slate-900/50 p-3 rounded-xl flex justify-between items-center mb-2 border border-white/5"><div class="leading-tight"><p class="text-[9px] font-black text-white uppercase truncate max-w-[150px]">${censo.find(h=>h.ci===p.ci)?.nombre || 'S/N'}</p><p class="text-[7px] text-slate-500 uppercase font-bold">REF: ${p.referencia}</p></div><p class="text-emerald-500 font-black text-[10px]">${p.monto} Bs</p></div>`).join('');
        }

        // --- MOTOR DE GENERACIÓN PDF ---
        function generarPDFStats() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.text("HDC 2026 - REPORTE DE RECAUDACIÓN", 14, 20);
            doc.setFontSize(10);
            doc.text(`Comunidad: ${uSession.comunidad_name} | Municipio: ${uSession.municipio_name}`, 14, 30);
            
            const rows = pagos.map(p => [
                censo.find(h=>h.ci===p.ci)?.nombre || p.ci,
                censo.find(h=>h.ci===p.ci)?.calle || '-',
                p.referencia,
                p.monto.toFixed(2) + " Bs"
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Beneficiario', 'Calle', 'Ref', 'Monto']],
                body: rows,
                theme: 'striped',
                headStyles: { fillColor: [16, 185, 129] }
            });

            doc.save(`Recaudacion_${uSession.comunidad_name}.pdf`);
        }

        function generarPDFDespacho() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.text("HDC 2026 - REPORTE DE DESPACHO Y CONCILIACIÓN", 14, 20);
            doc.setFontSize(10);
            doc.text(`Fecha: ${new Date().toLocaleDateString()} | Comunidad: ${uSession.comunidad_name}`, 14, 30);

            const rows = pagos.map(p => [
                censo.find(h=>h.ci===p.ci)?.nombre || p.ci,
                p.q10, p.q18, p.q43,
                p.recibidos,
                (p.recibidos == (p.q10+p.q18+p.q43) ? 'OK':'DIF')
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Beneficiario', '10kg', '18kg', '43kg', 'Entregado', 'Status']],
                body: rows,
                theme: 'grid',
                headStyles: { fillColor: [180, 83, 9] }
            });

            doc.save(`Despacho_${uSession.comunidad_name}.pdf`);
        }
    </script>
</body>
</html>
