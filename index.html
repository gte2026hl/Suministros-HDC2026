<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-200">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <title>HDC 2026 - Trazabilidad Extraordinaria</title>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { border-bottom: 2px solid #10b981 !important; color: #10b981 !important; opacity: 1 !important; }
        .sello-bg { background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%); box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4); border: 2px solid rgba(255, 255, 255, 0.2); }
        .sello-text { background: linear-gradient(to right, #f8fafc 0%, #94a3b8 40%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; line-height: 1; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <div id="login-view" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-10 rounded-[3rem] text-center space-y-8 border border-white/10 shadow-2xl">
            <div class="sello-bg w-28 h-28 rounded-2xl flex items-center justify-center mx-auto transform rotate-3 scale-110"><span class="sello-text text-2xl">HDC<br>2026</span></div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter text-white italic">HDC 2026 Portal</h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-2 italic">Seguridad Inmutable</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="user-input" placeholder="USUARIO" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 text-xs font-black tracking-widest uppercase">
                <input type="password" id="pass-input" placeholder="CONTRASEÑA" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-amber-500 text-xs font-black tracking-widest">
                <button onclick="intentarLogin()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.3em] shadow-xl shadow-amber-900/20 active:scale-95">Iniciar Sesión</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <nav class="w-full h-16 glass sticky top-0 z-50 flex items-center justify-between px-8 border-b border-slate-800 no-print">
            <div class="flex items-center gap-4">
                <div class="sello-bg w-10 h-10 rounded flex items-center justify-center transform -rotate-2"><span class="sello-text text-[7px]">HDC<br>2026</span></div>
                <div class="leading-none border-l border-slate-800 pl-4 ml-2">
                    <h2 id="disp-comunidad" class="text-[10px] font-black uppercase text-slate-200">---</h2>
                    <p id="disp-sector" class="text-[8px] text-emerald-500 font-bold uppercase tracking-widest mt-1">---</p>
                </div>
            </div>
            <div id="nav-btns" class="flex gap-2 h-full"></div>
        </nav>

        <main class="p-6 space-y-6 flex-grow" id="view-content"></main>

        <footer class="p-6 text-center text-slate-700 text-[9px] font-black uppercase tracking-[0.5em] glass border-t border-slate-900 no-print">
            HDC 2026 © Copyright | Trazabilidad Extraordinaria
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SB_URL = "https://wokszafewnnsmmhsvsqf.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indva3N6YWZld25uc21taHN2c3FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2ODkyMjEsImV4cCI6MjA5NDI2NTIyMX0.gYZ6rVgc74nE1Kxlykvr_beItgA6ndfv2bMs3godQK0";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        let u_session = null;
        let censo = [];
        let pagos = [];
        let config = {};

        async function intentarLogin() {
            const u = document.getElementById('user-input').value.toLowerCase();
            const p = document.getElementById('pass-input').value;

            const { data: user, error } = await _sb.from('perfiles').select('*').eq('usuario', u).eq('password', p).single();

            if (user) {
                u_session = user;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                await syncData();
                renderUI();
            } else alert("Acceso Denegado.");
        }

        async function syncData() {
            const { data: c } = await _sb.from('configuracion').select('*').single();
            const { data: h } = await _sb.from('habitantes').select('*');
            const { data: p } = await _sb.from('pagos').select('*').order('created_at', { ascending: false });
            config = c || {}; censo = h || []; pagos = p || [];
            document.getElementById('disp-comunidad').innerText = u_session.comunidad_asignada || config.comunidad_name;
            document.getElementById('disp-sector').innerText = u_session.sector_asignado || config.sector_name;
        }

        function renderUI() {
            const nav = document.getElementById('nav-btns');
            if(u_session.role === 'MASTER') {
                nav.innerHTML = `<button onclick="v_master()" id="n-master" class="h-full px-4 text-[9px] font-black uppercase tab-active">Admin Central</button>`;
                v_master();
            } else {
                nav.innerHTML = `
                    <button onclick="v_jefe('cobros')" id="n-cobros" class="h-full px-4 text-[9px] font-black uppercase tab-active">Cobros</button>
                    <button onclick="v_jefe('stats')" id="n-stats" class="h-full px-4 text-[9px] font-black uppercase text-slate-500">Estadísticas</button>
                    <button onclick="v_jefe('despacho')" id="n-despacho" class="h-full px-4 text-[9px] font-black uppercase text-slate-500">Despacho</button>
                `;
                v_jefe('cobros');
            }
            nav.innerHTML += `<button onclick="location.reload()" class="h-full px-4 text-rose-500 text-xs">✕</button>`;
        }

        function setActiveTab(id) {
            document.querySelectorAll('#nav-btns button').forEach(b => {
                b.classList.remove('tab-active'); b.classList.add('text-slate-500');
            });
            const active = document.getElementById(`n-${id}`);
            if(active) { active.classList.add('tab-active'); active.classList.remove('text-slate-500'); }
        }

        // --- VISTA MASTER: CREACIÓN DE USUARIOS Y CARGA EXCEL ---
        function v_master() {
            setActiveTab('master');
            document.getElementById('view-content').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
                    <div class="glass p-8 rounded-[2.5rem] space-y-6">
                        <h3 class="text-xs font-black uppercase text-amber-500 tracking-widest">Crear Jefe de Comunidad</h3>
                        <input type="text" id="nu_user" placeholder="Nombre de Usuario" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs">
                        <input type="text" id="nu_pass" placeholder="Contraseña" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs">
                        <input type="text" id="nu_com" placeholder="Comunidad que asigna" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs">
                        <input type="text" id="nu_sec" placeholder="Sector/Municipio" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs">
                        <button onclick="crearUsuario()" class="w-full bg-amber-600 text-white py-4 rounded-xl font-black text-[10px] uppercase">Registrar Jefe</button>
                        <div class="pt-4 border-t border-slate-800">
                            <input type="file" id="xl-up" class="hidden" accept=".xlsx" onchange="subirExcel(this)">
                            <label for="xl-up" class="block w-full bg-emerald-600 text-center py-4 rounded-xl font-black text-[10px] uppercase cursor-pointer">Subir Censo Excel (.xlsx)</label>
                        </div>
                    </div>
                    <div class="lg:col-span-2 glass p-8 rounded-[2.5rem] flex flex-col">
                        <h3 class="text-xs font-black uppercase text-slate-500 mb-6 flex justify-between"><span>Censo en la Nube</span><span class="text-emerald-500">${censo.length} Registros</span></h3>
                        <div class="overflow-y-auto max-h-[500px]">
                            <table class="w-full text-left text-[10px]">
                                <thead class="text-slate-500 uppercase font-black"><tr><th class="p-3">Nombre</th><th class="p-3">Calle</th><th class="p-3">Cédula</th></tr></thead>
                                <tbody>${censo.map(h => `<tr><td class="p-3 font-bold uppercase">${h.nombre}</td><td class="p-3 text-slate-600">${h.calle}</td><td class="p-3 mono text-emerald-500">${h.ci}</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        async function crearUsuario() {
            const nuevo = {
                usuario: document.getElementById('nu_user').value.toLowerCase(),
                password: document.getElementById('nu_pass').value,
                role: 'JEFE',
                comunidad_asignada: document.getElementById('nu_com').value,
                sector_asignado: document.getElementById('nu_sec').value
            };
            const { error } = await _sb.from('perfiles').insert([nuevo]);
            if(!error) { alert("Jefe de Comunidad Creado."); v_master(); }
        }

        async function subirExcel(input) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header:1});
                const rows = json.slice(1).map(r => ({ nombre: String(r[0]), calle: String(r[1]), ci: String(r[2]) })).filter(x => x.ci !== "undefined");
                await _sb.from('habitantes').delete().neq('ci', '0');
                await _sb.from('habitantes').insert(rows);
                alert("Nube Sincronizada."); location.reload();
            };
            reader.readAsArrayBuffer(input.files[0]);
        }

        // --- VISTA JEFE: OPERACIÓN CON PRECIOS EDITABLES ---
        function v_jefe(section) {
            setActiveTab(section);
            const container = document.getElementById('view-content');
            if(section === 'cobros') {
                container.innerHTML = `
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 fade-in">
                    <div class="xl:col-span-4 glass p-6 rounded-[2rem] border-l-4 border-amber-500 space-y-4">
                        <p class="text-[9px] font-black text-amber-500 uppercase tracking-widest">Ajuste de Precios del Ciclo</p>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">10KG</label><input type="number" id="p10" value="${config.p10}" oninput="calc()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">18KG</label><input type="number" id="p18" value="${config.p18}" oninput="calc()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                            <div class="bg-slate-950 p-2 rounded-xl text-center"><label class="text-[7px] text-slate-500 font-bold block">43KG</label><input type="number" id="p43" value="${config.p43}" oninput="calc()" class="bg-transparent w-full font-bold text-xs outline-none text-center"></div>
                        </div>
                        <button onclick="guardarPrecios()" class="w-full bg-slate-800 text-[8px] font-black uppercase py-2 rounded-lg text-slate-400 hover:text-white">Fijar Precios en Nube</button>
                    </div>
                    <div id="tot-cont" class="xl:col-span-8 grid grid-cols-4 gap-2"></div>
                    
                    <div class="xl:col-span-8 glass p-10 rounded-[2.5rem] space-y-8">
                        <div class="flex justify-between"><h3 class="text-xl font-black italic uppercase">Validador Táctico</h3><div id="badge" class="px-5 py-2 rounded-full text-[9px] font-black bg-slate-800 text-slate-500 uppercase">Listo</div></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div class="space-y-6">
                                <input type="number" id="ci" oninput="look(this.value)" class="w-full bg-slate-950 border border-slate-800 p-5 rounded-2xl text-2xl mono focus:border-amber-500 outline-none" placeholder="Cédula">
                                <div id="v_name" class="text-emerald-400 font-black uppercase text-xs"></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="ref" class="bg-slate-950 p-4 rounded-xl border border-slate-800 mono outline-none" placeholder="REF">
                                    <input type="number" id="m_ref" oninput="calc()" class="bg-slate-900 p-4 rounded-xl border border-slate-700 font-black text-white" placeholder="0.00">
                                </div>
                            </div>
                            <div class="bg-slate-950/40 p-8 rounded-3xl space-y-6">
                                <div class="grid grid-cols-3 gap-3">
                                    <input type="number" id="q10" value="0" oninput="calc()" class="bg-slate-900 p-4 rounded-xl text-center font-black">
                                    <input type="number" id="q18" value="0" oninput="calc()" class="bg-slate-900 p-4 rounded-xl text-center font-black">
                                    <input type="number" id="q43" value="0" oninput="calc()" class="bg-slate-900 p-4 rounded-xl text-center font-black">
                                </div>
                                <div class="flex justify-between"><span class="text-[9px] font-black text-slate-500 uppercase">Requerido:</span><span id="v_calc" class="text-3xl font-black mono text-white">0.00</span></div>
                                <button onclick="pago()" id="v_btn" disabled class="w-full bg-slate-800 text-slate-500 py-5 rounded-2xl font-black uppercase text-[10px] tracking-widest">Confirmar Cobro</button>
                            </div>
                        </div>
                    </div>
                    <div class="xl:col-span-4 glass p-8 rounded-[2rem] overflow-hidden">
                         <h4 class="text-[10px] font-black uppercase mb-6 flex justify-between"><span>Ciclo de Pago</span><span class="text-emerald-500">${pagos.length}</span></h4>
                         <div id="h-list" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
                    </div>
                </div>`;
                updateJefeUI();
            } else if (section === 'stats') {
                const paid = pagos.map(p => p.ci);
                const pend = censo.filter(h => !paid.includes(h.ci));
                container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 fade-in">
                    <div class="glass p-10 rounded-[2.5rem]">
                        <h3 class="text-xl font-black italic mb-6">RECAUDACIÓN POR CALLE</h3>
                        <table class="w-full text-xs text-left"><thead class="text-slate-500 uppercase"><tr><th>Calle</th><th>Monto</th></tr></thead>
                        <tbody class="divide-y divide-slate-900">${Object.entries(pagos.reduce((a,p)=>{
                            const c = censo.find(h=>h.ci===p.ci)?.calle || 'S/C';
                            a[c] = (a[c]||0) + p.monto; return a;
                        },{})).map(([c,m])=>`<tr><td class="py-4 font-bold uppercase">${c}</td><td class="py-4 font-black text-emerald-500">${m.toFixed(2)} Bs</td></tr>`).join('')}</tbody></table>
                    </div>
                    <div class="glass p-10 rounded-[2.5rem] border-l-4 border-rose-500">
                        <h3 class="text-xl font-black italic mb-6 text-rose-500">PENDIENTES (${pend.length})</h3>
                        <div class="overflow-y-auto max-h-[400px]">
                            <table class="w-full text-xs text-left"><thead><tr class="text-slate-600 font-black"><th>Nombre</th><th>Calle</th></tr></thead>
                            <tbody>${pend.map(h=>`<tr><td class="py-3 font-bold uppercase">${h.nombre}</td><td class="py-3 text-slate-500 text-[10px] uppercase">${h.calle}</td></tr>`).join('')}</tbody></table>
                        </div>
                    </div>
                </div>`;
            }
        }

        async function guardarPrecios() {
            const p = { p10: document.getElementById('p10').value, p18: document.getElementById('p18').value, p43: document.getElementById('p43').value };
            await _sb.from('configuracion').update(p).eq('id', 1);
            alert("Precios actualizados en la nube.");
            await syncData();
        }

        function look(v) { const h = censo.find(x => x.ci === v); document.getElementById('v_name').innerText = h ? `${h.nombre} • ${h.calle}` : ""; calc(); }

        function calc() {
            const req = (document.getElementById('q10').value * document.getElementById('p10').value) + (document.getElementById('q18').value * document.getElementById('p18').value) + (document.getElementById('q43').value * document.getElementById('p43').value);
            const ref = parseFloat(document.getElementById('m_ref').value) || 0;
            document.getElementById('v_calc').innerText = req.toFixed(2);
            const btn = document.getElementById('v_btn');
            const badge = document.getElementById('badge');
            if(req > 0 && Math.abs(req - ref) < 0.1) {
                btn.disabled = false; btn.className = "w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase text-[10px] cursor-pointer";
                badge.className = "px-5 py-2 rounded-full text-[9px] font-black bg-emerald-500 text-slate-950"; badge.innerText = "✓ COINCIDE";
            } else {
                btn.disabled = true; btn.className = "w-full bg-slate-800 text-slate-500 py-5 rounded-2xl font-black uppercase text-[10px]";
                badge.className = "px-5 py-2 rounded-full text-[9px] font-black bg-slate-800 text-slate-500"; badge.innerText = req > 0 ? "✗ DIFERENCIA" : "LISTO";
            }
        }

        async function pago() {
            const d = { ci: document.getElementById('ci').value, referencia: document.getElementById('ref').value, monto: parseFloat(document.getElementById('m_ref').value), q10: document.getElementById('q10').value, q18: document.getElementById('q18').value, q43: document.getElementById('q43').value, registrado_por: u_session.usuario };
            await _sb.from('pagos').insert([d]);
            await syncData(); v_jefe('cobros');
        }

        function updateJefeUI() {
            const t = pagos.reduce((a,p)=>({ c10: a.c10+p.q10, c18: a.c18+p.q18, c43: a.c43+p.q43, bs: a.bs+p.monto }), {c10:0,c18:0,c43:0,bs:0});
            document.getElementById('tot-cont').innerHTML = `
                <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500"><p class="text-[8px] font-black text-slate-500 uppercase">10kg</p><p class="text-xl font-black">${t.c10}</p></div>
                <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500"><p class="text-[8px] font-black text-slate-500 uppercase">18kg</p><p class="text-xl font-black">${t.c18}</p></div>
                <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500"><p class="text-[8px] font-black text-slate-500 uppercase">43kg</p><p class="text-xl font-black">${t.c43}</p></div>
                <div class="glass p-4 rounded-2xl border-l-4 border-blue-500"><p class="text-[8px] font-black text-slate-500 uppercase">Total Bs</p><p class="text-xl font-black">${t.bs.toFixed(2)}</p></div>
            `;
            document.getElementById('h-list').innerHTML = pagos.map(p => `<div class="bg-slate-900/50 p-4 rounded-xl flex justify-between"><div><p class="text-[10px] font-black uppercase">${censo.find(h=>h.ci===p.ci)?.nombre || 'S/N'}</p><p class="text-[8px] text-slate-500">REF: ${p.referencia}</p></div><p class="text-emerald-500 font-black text-xs">${p.monto} Bs</p></div>`).join('');
        }
    </script>
</body>
</html>
